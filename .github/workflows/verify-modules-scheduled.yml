# =============================================================================
# Scheduled Module Registry Verification
# =============================================================================
# Runs verify_modules.py on a cron schedule and on demand.
# If the registry changed, it opens/updates a PR carrying the updated
# module_registry.yaml — branch protection on main requires PRs, so a
# direct push is rejected (was the daily failure mode before 2026-10-27).
# Review/enable: the cron schedule is active. Disable by removing `schedule:`.
# =============================================================================

name: Module Registry Verification

on:
  workflow_dispatch:
  schedule:
    # Run every day at 06:00 UTC (low-traffic time).
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  verify:
    name: Verify and sync module registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync and verify all modules
        run: |
          python tools/verify_modules.py --sync

      - name: Open/update PR with updated registry if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain tools/module_registry.yaml)" ]; then
            BRANCH="chore/module-registry-sync"
            git checkout -B "$BRANCH"
            git add tools/module_registry.yaml
            git commit -m "chore: scheduled module registry verification"
            git push -f origin "$BRANCH"
            if ! gh pr view "$BRANCH" >/dev/null 2>&1; then
              gh pr create --base main --head "$BRANCH" \
                --title "chore: module registry sync" \
                --body "Regenerated tools/module_registry.yaml via scheduled verify-modules run. Review and merge to land the drift update."
            else
              echo "PR already open for $BRANCH — branch updated."
            fi
          else
            echo "No registry changes."
          fi
