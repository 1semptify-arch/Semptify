# =============================================================================
# Semptify CI/CD Pipeline
# =============================================================================
# Runs on: push to main, pull requests
# Jobs: lint, test, build, security scan
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  INVENTORY_DIR: inventory

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Format Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pre-commit==3.6.0" ruff black mypy detect-secrets bandit pytest
          pip install -r requirements.txt

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Verify tracker sync
        run: python tools/sync_orchestrator.py --check

      - name: Run Ruff (linter)
        run: ruff check app/ --output-format=github
        continue-on-error: true

      - name: Run Black (formatter check)
        run: black --check app/
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    # CI timeout: full suite on main can approach 50 minutes. PRs run a fast
    # marker subset. If the full suite times out on main, the build job below
    # is blocked, no Docker image is pushed, and a tracker incident task must
    # be opened before any further PR is merged.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sprint 2 security isolation gates (mandatory)
        if: github.event_name == 'push'
        run: |
          pytest tests/test_security_isolation_gates.py -q --no-cov
        env:
          SECURITY_MODE: enforced
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci-only  # pragma: allowlist secret

      - name: Run Sprint 3 action router gates (mandatory)
        if: github.event_name == 'push'
        run: |
          pytest tests/test_action_router_gates.py -q --no-cov
        env:
          SECURITY_MODE: enforced
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci-only  # pragma: allowlist secret

      - name: Run SSOT Architecture Compliance Gate (mandatory)
        if: github.event_name == 'push'
        run: |
          pytest tests/test_ssot_architecture.py -v --tb=short --no-cov
        env:
          SECURITY_MODE: enforced
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci-only  # pragma: allowlist secret

      - name: Run fast PR test marker subset
        if: github.event_name == 'pull_request'
        run: |
          pytest -m "core_gate or security_gate or action_gate" -v --no-cov
        env:
          SECURITY_MODE: enforced
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci-only  # pragma: allowlist secret

      - name: Run full test suite with coverage
        if: github.event_name == 'push'
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
        env:
          SECURITY_MODE: enforced
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci-only  # pragma: allowlist secret

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Security Scan
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit security scan
        run: bandit -r app/ -c .bandit -f json -o bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()

  # ---------------------------------------------------------------------------
  # Build Docker Image
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Post-merge failure policy:
    # - If the full test suite fails on main, this build job is blocked and no
    #   Docker image is pushed.
    # - A tracker incident task (e.g., todo-082) must be created and assigned;
    #   the merge queue is blocked.
    # - The next PR must fix the regression before any further PR is merged.
    # - No silent auto-revert is configured; failures are surfaced for manual
    #   triage and a deliberate fix.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Dependency Review (PRs only)
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
