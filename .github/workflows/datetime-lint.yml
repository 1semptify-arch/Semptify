name: Enforce UTC Datetime Consistency

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  datetime-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for direct datetime.now() usage
      run: |
        # Count violations (exclude app/core/utc.py which is the implementation)
        # Also exclude comments/docstrings that mention datetime.now() as guidance
        violations=$(grep -rn "datetime\.now(" app/ --include="*.py" --exclude="utc.py" | grep -v "# .*datetime\.now" | grep -v '"""' | grep -v "'''" | wc -l)

        if [ $violations -gt 0 ]; then
          echo "❌ Found $violations instances of datetime.now() — use utc_now() from app.core.utc instead"
          echo ""
          echo "Violations:"
          grep -rn "datetime\.now(" app/ --include="*.py" --exclude="utc.py" | grep -v "# .*datetime\.now" | grep -v '"""' | grep -v "'''" | head -20
          exit 1
        else
          echo "✅ All datetime usage is consistent — utc_now() used everywhere"
        fi
