name: Enforce UTC Datetime Consistency

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  datetime-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check for datetime.now(timezone.utc) usage
      run: |
        # Count violations
        violations=$(grep -r "datetime\.now(timezone\.utc)" app/ --include="*.py" | wc -l)
        
        if [ $violations -gt 0 ]; then
          echo "❌ Found $violations instances of datetime.now(timezone.utc)"
          echo "Use utc_now() from app.core.utc instead"
          echo ""
          echo "Violations:"
          grep -r "datetime\.now(timezone.utc)" app/ --include="*.py" | head -20
          exit 1
        else
          echo "✅ All datetime usage is consistent"
        fi
