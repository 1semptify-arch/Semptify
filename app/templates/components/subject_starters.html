{% macro render_starters(starters) %}
<section class="frame-panel">
    <div class="frame-panel--header">
        <span class="frame-panel--title">What is going on?</span>
    </div>
    <div class="frame-panel--body">
        <p style="color:#94a3b8; font-size:0.9375rem; margin-bottom:0.75rem;">
            Pick the situation closest to yours. Each one points you toward the right tool.
        </p>
        <div class="starter-chips" style="display:flex; flex-wrap:wrap; gap:0.5rem;">
            {% for starter in starters %}
            <a href="{{ starter.href }}" class="frame-btn" style="white-space:nowrap; font-size:0.875rem; padding:0.375rem 0.75rem;">
                {{ starter.text }}
            </a>
            {% endfor %}
        </div>
    </div>
</section>
{% endmacro %}
