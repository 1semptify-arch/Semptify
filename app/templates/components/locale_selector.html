<form method="post" action="/api/i18n/set-locale" class="locale-selector" aria-label="{{ _("language.selector.aria") }}">
    <label for="locale-select" class="locale-selector__label">{{ _("language.label") }}</label>
    <select id="locale-select" name="locale" class="locale-selector__select" aria-label="{{ _("language.selector.aria") }}">
        {% for code, name in supported_locales.items() %}
        <option value="{{ code }}" {% if get_locale(request) == code %}selected{% endif %}>
            {{ name }}
        </option>
        {% endfor %}
    </select>
    <button type="submit" class="locale-selector__button">{{ _("action.save") }}</button>
</form>
