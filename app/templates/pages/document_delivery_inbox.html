{% extends "base.html" %}

{% block title %}Delivery Inbox - Semptify{% endblock %}

{% block styles %}
<style>
  .page-wrap { max-width: var(--max-width-5xl); margin: 0 auto; padding: var(--space-4); }
  .page-info { margin-bottom: var(--space-6); }
  .page-info h1 { font-size: var(--text-3xl); color: var(--text-primary); margin: 0 0 var(--space-1); }
  .page-info p { font-size: var(--text-base); color: var(--text-secondary); margin: 0; }

  .panel {
    background: var(--zone-surface-2);
    border-radius: var(--radius-lg);
    padding: var(--space-6);
    box-shadow: var(--elevation-1);
  }

  .doc-item { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3); border-radius: var(--radius-md); background: var(--zone-surface-1); }
  .doc-item + .doc-item { margin-top: var(--space-2); }
  .doc-info { flex: 1; }
  .doc-subject { font-size: var(--text-sm); color: var(--text-primary); font-weight: 600; margin: 0 0 var(--space-1); }
  .doc-meta { font-size: var(--text-xs); color: var(--text-muted); }
  .doc-status { font-size: var(--text-xs); padding: var(--space-1) var(--space-2); border-radius: var(--radius-pill); margin-left: var(--space-2); color: var(--text-inverse); }
  .doc-status.pending { background: var(--color-warning); }
  .doc-status.signed { background: var(--color-success); }
  .doc-status.declined { background: var(--color-error); }

  .reaction { font-size: var(--text-sm); color: var(--color-warning); text-align: center; padding: var(--space-4); }
  .empty-state { text-align: center; padding: var(--space-6); font-size: var(--text-sm); color: var(--text-muted); }

  @media (max-width: 768px) {
    .page-wrap { padding: var(--space-4); }
    .panel { padding: var(--space-4); }
    .doc-item { flex-direction: column; align-items: flex-start; gap: var(--space-2); }
    .doc-status { margin-left: 0; }
  }
</style>
{% endblock %}

{% block content %}
<div class="page-wrap">
  <div class="page-info">
    <h1>Delivery Inbox</h1>
    <p>Documents sent to you for review and signature.</p>
  </div>

  <div class="panel" id="inbox">
    <div class="reaction" id="reaction">Loading inbox...</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const docs = [
    { sender: 'Acme Property Mgmt', subject: 'Lease Renewal 2024', date: '2024-03-15', status: 'pending' },
    { sender: 'Legal Aid Society', subject: 'Settlement Agreement', date: '2024-03-10', status: 'signed' },
    { sender: 'City Housing Dept', subject: 'Inspection Report', date: '2024-03-08', status: 'declined' }
  ];
  function loadInbox() {
    const box = document.getElementById('inbox');
    setTimeout(() => {
      if (docs.length === 0) {
        box.innerHTML = '<div class="empty-state">No documents pending.</div>';
        return;
      }
      box.innerHTML = docs.map(d =>
        '<div class="doc-item"><div class="doc-info"><p class="doc-subject">' + d.subject + '</p><p class="doc-meta">From: ' + d.sender + ' &middot; ' + d.date + '</p></div><span class="doc-status ' + d.status + '">' + d.status + '</span><button class="btn btn--primary btn--sm" onclick="alert(\'Opening ' + d.subject + '\')">Open</button></div>'
      ).join('');
    }, 1000);
  }
  loadInbox();
</script>
{% endblock %}
