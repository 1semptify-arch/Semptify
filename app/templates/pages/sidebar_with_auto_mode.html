{% extends "base.html" %}

{% block title %}Sidebar Auto Mode - Semptify{% endblock %}

{% block styles %}
<style>
  .page-wrap { max-width: var(--space-xxl); margin: 0 auto; padding: var(--space-lg); }

  .page-info { margin-bottom: var(--space-lg); }
  .page-info h1 { font-size: var(--font-size-xl); color: var(--color-text-primary); margin: 0 0 var(--space-xs); }
  .page-info p { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin: 0; }

  .panel { background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-lg); margin-bottom: var(--space-lg); }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: var(--space-sm) 0; }
  .toggle-row label { font-size: var(--font-size-sm); color: var(--color-text-primary); }
  .toggle { position: relative; width: 44px; height: 24px; background: var(--color-surface-alt); border-radius: var(--radius-pill); cursor: pointer; transition: background 0.2s; }
  .toggle.active { background: var(--color-primary); }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: var(--color-on-primary); border-radius: 50%; transition: transform 0.2s; }
  .toggle.active::after { transform: translateX(20px); }

  .btn-primary {
    padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md);
    background: var(--color-primary); color: var(--color-on-primary);
    border: none; font-size: var(--font-size-sm); cursor: pointer;
  }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .reaction { margin-top: var(--space-md); font-size: var(--font-size-sm); }
  .reaction.working { color: var(--color-warning); }
  .reaction.done { color: var(--color-success); }

  @media (max-width: 768px) {
    .page-wrap { padding: var(--space-md); }
    .panel { padding: var(--space-md); }
    .toggle-row { flex-direction: row; }
  }
</style>
{% endblock %}

{% block content %}
<div class="page-wrap">
  <!-- INFORMATION -->
  <div class="page-info">
    <h1>Sidebar Auto Mode</h1>
    <p>Configure sidebar auto-mode behavior.</p>
  </div>

  <!-- INPUT -->
  <div class="panel">
    <div class="toggle-row">
      <label for="t1">Enable auto-sidebar</label>
      <div class="toggle active" id="t1" onclick="toggle(this)"></div>
    </div>
    <div class="toggle-row">
      <label for="t2">Auto-collapse on mobile</label>
      <div class="toggle" id="t2" onclick="toggle(this)"></div>
    </div>
    <div class="toggle-row">
      <label for="t3">Show notifications</label>
      <div class="toggle active" id="t3" onclick="toggle(this)"></div>
    </div>

    <!-- ACTION -->
    <button class="btn-primary" id="save-btn" onclick="saveSettings()">Save</button>
    <div class="reaction working" id="reaction" style="display:none;">Saving...</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function toggle(el) { el.classList.toggle('active'); }
  function saveSettings() {
    const btn = document.getElementById('save-btn');
    const rxn = document.getElementById('reaction');
    btn.disabled = true;
    rxn.style.display = 'block';
    rxn.className = 'reaction working';
    rxn.textContent = 'Saving...';
    setTimeout(() => {
      rxn.className = 'reaction done';
      rxn.textContent = 'Saved';
      btn.disabled = false;
      setTimeout(() => { rxn.style.display = 'none'; }, 2000);
    }, 1000);
  }
</script>
{% endblock %}
