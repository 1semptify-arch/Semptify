<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semptify Status</title>
  <style>
    body { font-family: sans-serif; background: var(--tone-900); color: var(--color-calm-100); padding: 2rem; }
    h1 { font-size: 1.5rem; }
    .card { background: var(--color-primary-dark); padding: 1rem; margin: 1rem 0; border-left: 4px solid var(--color-info); }
    .ok { color: var(--color-success); }
    .bad { color: var(--color-error); }
    a { color: var(--color-info); }
  </style>
</head>
<body>
  <h1>Semptify Status</h1>
  <p>Current service health.</p>
  <div id="board"><p>Loading…</p></div>
  <p><a href="mailto:support@semptify.org?subject=Semptify%20status%20report">Report a problem</a></p>
  <script>
  async function check(name, url) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      const text = await r.text();
      let json = null;
      try { json = JSON.parse(text); } catch (e) {}
      const ok = r.ok && (!json || json.status === 'ok');
      return `<div class="card"><h2>${name}</h2><p class="${ok ? 'ok' : 'bad'}">${ok ? 'Operational' : 'Unavailable'}</p><p>${r.status}</p></div>`;
    } catch (err) {
      return `<div class="card"><h2>${name}</h2><p class="bad">Unavailable</p><p>${err.message}</p></div>`;
    }
  }
  async function load() {
    document.getElementById('board').innerHTML = (await Promise.all([
      check('Liveness', '/healthz'),
      check('Readiness', '/readyz'),
      check('API Health', '/api/health'),
    ])).join('');
  }
  load();
  setInterval(load, 30000);
  </script>
</body>
</html>
