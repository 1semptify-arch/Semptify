<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semptify Admin — Under Construction</title>
<link rel="stylesheet" href="/static/css/ssot-design-system.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .uc-card {
    background: var(--bg-card);
    border: none;
    border-radius: var(--radius-block);
    padding: 2.5rem;
    max-width: 520px;
    width: 90%;
    text-align: center;
    box-shadow: var(--elevation-2);
  }
  .uc-icon {
    font-size: 2.5rem;
    margin-bottom: 1rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 0.75rem 0;
  }
  p {
    color: var(--text-secondary);
    line-height: 1.6;
    margin: 0 0 1.5rem 0;
  }
  .uc-actions a {
    color: var(--color-primary);
    text-decoration: none;
    font-weight: 600;
  }
  .uc-actions a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="uc-card">
    <div class="uc-icon">🚧</div>
    <h1>Admin portal under construction</h1>
    <p>The administration portal is being rebuilt. Only essential operations will remain. Check back once the new design and scope are finalized.</p>
    <div class="uc-actions">
      <a href="/admin/logout">Log out</a>
      &nbsp;·&nbsp;
      <a href="/">Back to Semptify home</a>
    </div>
  </div>
</body>
</html>
