<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Semptify</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        h1 {
            color: #f8fafc;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .error {
            background: #ef4444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .error.show {
            display: block;
        }
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo-icon {
            font-size: 48px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <div class="logo-icon">🔧</div>
        </div>
        <h1>Admin Access</h1>
        <p class="subtitle">Semptify Administration</p>
        
        <div id="error" class="error"></div>
        
        <!-- Step 1: Username/Password -->
        <form id="step1Form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            
            <button type="submit" id="step1Btn">Continue</button>
        </form>

        <!-- Step 2: 2FA Code (hidden initially) -->
        <form id="step2Form" style="display:none;">
            <div class="form-group">
                <label for="totpCode">Two-Step Code</label>
                <input type="text" id="totpCode" name="totpCode" required 
                       maxlength="6" pattern="[0-9]{6}" 
                       placeholder="000000" autocomplete="one-time-code">
                <small style="color:#94a3b8;font-size:12px;margin-top:4px;display:block;">
                    Enter 6-digit code from your authenticator app
                </small>
            </div>
            
            <button type="submit" id="step2Btn">Verify & Sign In</button>
            <button type="button" id="backBtn" style="background:#475569;margin-top:10px;">← Back</button>
        </form>
    </div>

    <script>
        let pendingUsername = '';
        let pendingPassword = '';

        // Step 1: Validate username/password
        document.getElementById('step1Form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            pendingUsername = document.getElementById('username').value;
            pendingPassword = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const step1Btn = document.getElementById('step1Btn');
            
            step1Btn.disabled = true;
            step1Btn.textContent = 'Checking...';
            errorDiv.classList.remove('show');
            
            try {
                const response = await fetch('/admin/api/login-step1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: pendingUsername, password: pendingPassword }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok && data.step2_required) {
                    // Show 2FA step
                    document.getElementById('step1Form').style.display = 'none';
                    document.getElementById('step2Form').style.display = 'block';
                    document.getElementById('totpCode').focus();
                } else {
                    const errorMsg = data.error || data.detail || 'Invalid credentials';
                    errorDiv.textContent = typeof errorMsg === 'string' ? errorMsg : JSON.stringify(errorMsg);
                    errorDiv.classList.add('show');
                }
            } catch (err) {
                errorDiv.textContent = 'Login failed. Please try again.';
                errorDiv.classList.add('show');
                if (window.SemptifyFeedback) SemptifyFeedback.error('Login failed.', { detail: err.message });
            } finally {
                step1Btn.disabled = false;
                step1Btn.textContent = 'Continue';
            }
        });

        // Step 2: Verify 2FA code
        document.getElementById('step2Form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const totpCode = document.getElementById('totpCode').value;
            const errorDiv = document.getElementById('error');
            const step2Btn = document.getElementById('step2Btn');
            
            step2Btn.disabled = true;
            step2Btn.textContent = 'Verifying...';
            errorDiv.classList.remove('show');
            
            try {
                const response = await fetch('/admin/api/login-step2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: pendingUsername, 
                        password: pendingPassword,
                        totp_code: totpCode 
                    }),
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    window.location.href = '/admin/dashboard.html';
                } else {
                    const errorMsg = data.error || data.detail || 'Invalid code';
                    errorDiv.textContent = typeof errorMsg === 'string' ? errorMsg : JSON.stringify(errorMsg);
                    errorDiv.classList.add('show');
                    document.getElementById('totpCode').value = '';
                    document.getElementById('totpCode').focus();
                }
            } catch (err) {
                errorDiv.textContent = 'Verification failed. Please try again.';
                errorDiv.classList.add('show');
                if (window.SemptifyFeedback) SemptifyFeedback.error('Verification failed.', { detail: err.message });
            } finally {
                step2Btn.disabled = false;
                step2Btn.textContent = 'Verify & Sign In';
            }
        });

        // Back button
        document.getElementById('backBtn').addEventListener('click', () => {
            document.getElementById('step2Form').style.display = 'none';
            document.getElementById('step1Form').style.display = 'block';
            pendingUsername = '';
            pendingPassword = '';
        });
    </script>
  <script src="/static/components/feedback.js"></script>
</body>
</html>
