<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semptify - Welcome</title>
    <!-- SSOT: Navigation fetched from API, no hardcoded URLs -->
    <script>
        // Fetch canonical navigation from SSOT registry, then redirect
        fetch('/onboarding/ssot-navigation')
            .then(res => res.json())
            .then(nav => {
                const entryPath = nav.entry_points?.onboarding_start || '/onboarding/start';
                window.location.href = entryPath;
            })
            .catch(() => {
                // Fallback only if API unavailable
                window.location.href = '/onboarding/start';
            });
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .loading {
            text-align: center;
            color: white;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <p>Loading Semptify...</p>
    </div>
  <script src="/static/components/feedback.js"></script>
</body>
</html>
