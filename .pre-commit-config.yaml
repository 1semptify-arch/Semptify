# Pre-commit hooks for Semptify FastAPI
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  # NOTE: trailing-whitespace, end-of-file-fixer, check-merge-conflict,
  # check-added-large-files, and detect-private-key are disabled because
  # pre-commit 3.6.0 (pinned in CI) passes -w flag to all hooks, which
  # these hooks don't support. Re-enable them once CI upgrades to
  # pre-commit 4.0.1+.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml

  # Python linting with Ruff (fast)
  # NOTE: ruff and ruff-format are disabled in pre-commit because the codebase
  # has existing lint issues that would block all PRs. They're still run as
  # separate CI steps with continue-on-error: true. Re-enable once the
  # codebase is clean.
  # - repo: https://github.com/astral-sh/ruff-pre-commit
  #   rev: v0.3.0
  #   hooks:
  #     - id: ruff
  #       args: [--exit-non-zero-on-fix]
  #     - id: ruff-format

  # Type checking (optional, can be slow)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.8.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [pydantic, fastapi]
  #       args: [--ignore-missing-imports]

  # Security scanning
  # NOTE: bandit is disabled in pre-commit because the codebase has existing
  # security findings that would block all PRs. It's still run as a separate
  # CI job (Security Scan). Re-enable once the codebase is clean.
  # - repo: https://github.com/PyCQA/bandit
  #   rev: 1.7.7
  #   hooks:
  #     - id: bandit
  #       args: ["-c", ".bandit"]
  #       exclude: tests/

  # Check for secrets accidentally committed (local hook to avoid -w flag issue in v1.5.0)
  # Only scan app/ source code — data/, docs/, scripts/, installer/, tests/, tools/,
  # .env templates, and other non-app files generate too many false positives.
  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect secrets
        entry: python scripts/detect_secrets_hook.py --baseline .secrets.baseline
        language: system
        pass_filenames: true
        files: ^app/

  # Validate pyproject.toml / setup.py
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.16
    hooks:
      - id: validate-pyproject

  # SSOT Architecture Compliance Check - MANDATORY
  - repo: local
    hooks:
      - id: ssot-architecture-check
        name: SSOT Architecture Verification
        entry: python scripts/verify_ssot.py
        language: system
        pass_filenames: false
        always_run: true
        description: "Enforces Single Source of Truth architecture - no hardcoded URLs allowed"

  - repo: local
    hooks:
      - id: guardrail-engine
        name: Run all guardrail checks
        entry: python tools/guardrail_engine.py
        language: system
        pass_filenames: false
        always_run: true
        description: "Unified guardrail engine: stub detection, manifest/sync check, and future checks"

  - repo: local
    hooks:
      - id: sync-orchestrator
        name: Sync stub/task state
        entry: python tools/sync_orchestrator.py --git-add
        language: system
        pass_filenames: false
        always_run: true

# Configuration for specific hooks
default_language_version:
  python: python3.11

# Exclude patterns
exclude: |
  (?x)^(
    \.git/|
    \.venv/|
    venv311/|
    __pycache__/|
    \.mypy_cache/|
    static/_archive/|
    archive/|
    alembic/versions/|
    semptify_dakota_eviction/|
    mobile_ai_host/|
    funding_forge/|
    legal_intel/
  )$
