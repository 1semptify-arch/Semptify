# Pre-commit hooks for Semptify FastAPI
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: check-case-conflict

  # Python linting with Ruff (fast)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Type checking (optional, can be slow)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.8.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [pydantic, fastapi]
  #       args: [--ignore-missing-imports]

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: ["-c", ".bandit"]
        exclude: tests/

  # Check for secrets accidentally committed (local hook to avoid -w flag issue in v1.5.0)
  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect secrets
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: system
        pass_filenames: true
        exclude: >
          (?x)^(
            package\.lock\.json|
            tools/agent_orchestrator_tasks\.json|
            tools/orchestrator_dashboard\.html|
            tools/agent_orchestrator\.html
          )$

  # Validate pyproject.toml / setup.py
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.16
    hooks:
      - id: validate-pyproject

  # SSOT Architecture Compliance Check - MANDATORY
  - repo: local
    hooks:
      - id: ssot-architecture-check
        name: SSOT Architecture Verification
        entry: python3 scripts/verify_ssot.py
        language: system
        pass_filenames: false
        always_run: true
        description: "Enforces Single Source of Truth architecture - no hardcoded URLs allowed"

  - repo: local
    hooks:
      - id: guardrail-engine
        name: Run all guardrail checks
        entry: python3 tools/guardrail_engine.py
        language: system
        pass_filenames: false
        always_run: true
        description: "Unified guardrail engine: stub detection, manifest/sync check, and future checks"

  - repo: local
    hooks:
      - id: sync-orchestrator
        name: Sync stub/task state
        entry: python3 tools/sync_orchestrator.py --git-add
        language: system
        pass_filenames: false
        always_run: true

# Configuration for specific hooks
default_language_version:
  python: python3.11

# Exclude patterns
exclude: |
  (?x)^(
    \.git/|
    \.venv/|
    venv311/|
    __pycache__/|
    \.mypy_cache/|
    static/_archive/|
    archive/|
    alembic/versions/|
    semptify_dakota_eviction/|
    mobile_ai_host/|
    funding_forge/|
    legal_intel/
  )$
