# doc-map.yaml — load-bearing mapping between documentation and the code it describes.
#
# Each entry links a doc file (path relative to docs/) to the code paths
# (relative to repo root) whose behavior the doc documents. This is what
# makes the scheduled staleness check possible: without a mapping there is
# no way to know which docs a given code change should have touched.
#
# Categories (drive the commit-tagged changelog prefix):
#   admin  — internal admin operations, module registry, contracts, deploy
#   user   — tenant-facing how-to content
#   help   — support / FAQ-style content
#   adr    — Architecture Decision Records (permanent, dated, never edited)
#
# Adding a new doc: append an entry here. The staleness check only sees docs
# that appear in this file.
#
# NOTE on layout: existing docs currently live flat in docs/ (e.g. docs/ADMIN_MANUAL.md).
# They are mapped here at those flat paths. New docs should go in the appropriate
# subdir (admin/, user-guides/, help/, adr/). Relocating the existing flat docs
# into subdirs is a tracked follow-up — do NOT move them in the same pass that
# adds the staleness mechanism (see Known Failure #17: half-finished migrations).

