[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    core_gate: Mandatory core completion gate tests (Sprint 1)
    security_gate: Mandatory security isolation gate tests (Sprint 2)
    action_gate: Mandatory action router gate tests (Sprint 3)
    module_health: Consolidated module health checks (import/routes/exposure)
    integration: Tests that require external services (OAuth, DB, storage)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage settings
# Memory note: the full suite (~1,500 tests) can hit 95%+ memory in a single
# process. To avoid OOM on constrained machines, split runs:
#   Fast (no coverage, no module_health):  pytest tests/ --ignore=tests/module_health --no-cov -q
#   Module health only:                    pytest tests/module_health/ --no-cov -q
#   With coverage (run in two chunks):     pytest tests/ --ignore=tests/module_health --cov=app --cov-fail-under=30
#                                          pytest tests/module_health/ --cov=app --cov-append --cov-fail-under=30
addopts = --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=30
