[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    core_gate: Mandatory core completion gate tests (Sprint 1)
    security_gate: Mandatory security isolation gate tests (Sprint 2)
    action_gate: Mandatory action router gate tests (Sprint 3)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Temporarily ignore tests that import stale APIs while the feature/vault modules evolve
addopts =
    --ignore=tests/test_features.py
    --ignore=tests/test_vault_manager_sequence.py
