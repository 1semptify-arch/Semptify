[project]
name = "semptify"
version = "5.0.0"
description = "Tenant Rights Protection Platform - FastAPI Backend"
readme = "README.md"
requires-python = "==3.11.9"
license = {text = "MIT"}
authors = [
    {name = "Semptify Team", email = "support@semptify.com"}
]
keywords = ["tenant-rights", "legal-tech", "fastapi", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/Semptify/Semptify-FastAPI"
Documentation = "https://github.com/Semptify/Semptify-FastAPI/blob/main/PRODUCTION.md"
Repository = "https://github.com/Semptify/Semptify-FastAPI"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# =============================================================================
# Ruff Configuration (Fast Python Linter & Formatter)
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
    "static/_archive",
    "build",
    "dist",
    "legal_intel/**/*.py",
    # Root-level standalone test/debug scripts (not part of the test suite)
    "test_crawler.py",
    "test_flows.py",
    "test_upload_simple.py",
    "test_vault_simple.py",
    "test_vault_system.py",
    "test_overlay_api.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module import not at top (common in FastAPI app setup)
    "E711",   # none-comparison (legitimate in some ORM contexts)
    "E712",   # true-false-comparison (legitimate in some ORM contexts)
    "E741",   # ambiguous-variable-name (common in legal domain code)
    "E702",   # multiple-statements-on-one-line-semicolon
    "W291",   # trailing-whitespace (handled by formatter)
    "W293",   # blank-line-with-whitespace (handled by formatter)
    "W191",   # tab-indentation (legacy files)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise from (too noisy)
    "B007",   # unused loop control variable
    "B905",   # zip without explicit strict (style preference)
    "S101",   # assert statements (used in tests)
    "S104",   # bind to all interfaces (needed for Docker)
    "S105",   # hardcoded password (false positives in configs)
    "S106",   # hardcoded password (false positives in configs)
    "S110",   # try-except-pass (legitimate pattern in error handlers)
    "S112",   # try-except-continue (legitimate pattern in loops)
    "S310",   # suspicious url open (false positives in API clients)
    "S311",   # suspicious non-cryptographic random (used for non-security purposes)
    "S314",   # suspicious xml element tree (used for legitimate XML parsing)
    "S603",   # subprocess without shell (used with fixed args)
    "S607",   # start process with partial path (platform-specific)
    "ARG001", # unused function argument (common in FastAPI)
    "ARG002", # unused method argument
    "ARG003", # unused class method argument
    "ARG004", # unused static method argument
    "ARG005", # unused lambda argument
    "A002",   # builtin argument shadowing (common in FastAPI: id, type, etc.)
    "PTH",    # use pathlib instead of os.path (style preference, too many to fix)
    "SIM",    # flake8-simplify (style preference, could change behavior)
    "C401",   # unnecessary generator set (style preference)
    "UP042",  # replace-str-enum (too many to migrate now)
    "TCH002",  # typing-only third-party import (nice-to-have, not critical)
    "TCH003",  # typing-only standard-library import (nice-to-have, not critical)
    "S324",   # hashlib-insecure-hash-function (md5 used for non-crypto cache keys, filenames)
    "B006",   # mutable-argument-default (would need code changes, low risk)
    "C414",   # unnecessary-double-cast-or-process (style preference)
    "B004",   # unreliable-callable-check (false positives)
    "F402",   # import-shadowed-by-loop-var (legitimate pattern in routing code)
    "F403",   # undefined-local-with-import-star (used in __init__.py and scripts)
    "B023",   # function-uses-loop-variable (complex to fix safely)
    "S602",   # subprocess-popen-with-shell-equals-true (used in install scripts)
    "S606",   # start-process-with-no-shell (os.startfile on Windows)
    "S608",   # hardcoded-sql-expression (false positives in non-SQL contexts)
    "S108",   # hardcoded-temp-file (legitimate /tmp usage on Linux)
    "A001",   # builtin-variable-shadowing (sdk/exceptions.py intentionally shadows)
    "B017",   # assert-raises-exception (used in tests for broad exception checks)
    "S102",   # exec-builtin (used in legitimate tooling)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "F841"]
"alembic/**/*.py" = ["F401", "E402"]
"app/main.py" = ["E402"]  # imports not at top
"scripts/verify_ssot.py" = ["S603"]  # subprocess call with fixed args, no untrusted input
"scripts/init_postgres.py" = ["F403"]  # import * for model registration
"plugins/hello_world/__init__.py" = ["F403"]  # import * for plugin exports
"app/services/pdf_extractor.py" = ["F401"]  # try/except optional imports
"app/services/vertex_session_fix.py" = ["F401"]  # try/except optional imports
"app/modules/court_packet/router.py" = ["F401"]  # try/except optional imports
"app/modules/intake/service.py" = ["F401"]  # try/except optional imports
"app/services/document_notarization.py" = ["F401"]  # try/except optional imports
"app/services/document_pipeline.py" = ["F401"]  # try/except optional imports
"app/modules/vault/router.py" = ["F401"]  # try/except optional imports
"app/modules/document_converter/converter.py" = ["F401"]  # try/except optional imports
"app/modules/litigation_intelligence/graph_engine.py" = ["F401"]  # try/except optional imports
"app/services/eviction/pdf.py" = ["F401"]  # try/except optional imports
"app/sdk/__init__.py" = ["F401"]  # SDK public API re-exports

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# Pytest Configuration
# =============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = [
    "-ra",                    # show extra test summary
    "--strict-markers",       # fail on unknown markers
    "-q",                     # quiet mode
]

# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/__init__.py",
    "alembic/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 50
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

# =============================================================================
# Black Configuration (if used instead of ruff format)
# =============================================================================

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | alembic/versions
    | static/_archive
)/
'''

# =============================================================================
# MyPy Configuration (Optional Type Checking)
# =============================================================================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
strict_optional = true
exclude = [
    "alembic/",
    "tests/",
    "static/",
]

[[tool.mypy.overrides]]
module = "app.routers.*"
ignore_errors = true
