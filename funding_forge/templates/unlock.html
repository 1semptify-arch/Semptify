<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter workspace key — Funding Forge</title>
  <link rel="stylesheet" href="/static/css/funding_forge.css">
</head>
<body class="unlock-body">
  <div class="unlock-card">
    <h1>Funding Forge</h1>
    <p class="unlock-lead">This workspace is protected by a private key. Enter it to continue.</p>
    {% if error %}
      <div class="flash flash-error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/unlock" class="unlock-form">
      <label for="key">Workspace key</label>
      <input type="password" id="key" name="key" required autofocus>
      <button type="submit" class="button">Open workspace</button>
    </form>
  </div>
</body>
</html>
